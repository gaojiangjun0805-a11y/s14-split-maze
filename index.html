<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111512">
<link rel="icon" href="data:,">
<title>拆墙寻码 · 迷宫密码挑战</title>
<style>
  :root {
    color-scheme: dark;
    --background: #111512;
    --panel: #191e19;
    --board: #131914;
    --line: #323c32;
    --text: #f0f3ea;
    --muted: #b1bcb0;
    --lime: #d7f984;
    --mint: #a0e3db;
    --danger: #ffb1a2;
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
    --sans: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--background); color: var(--text); font-family: var(--sans); }
  button, a, input { -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; }
  button, a { touch-action: manipulation; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .47; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
  a { color: inherit; text-decoration: none; }
  .shell { width: min(1080px, calc(100% - 64px)); margin: 0 auto; }
  .mast { border-bottom: 1px solid var(--line); }
  .mast .shell { min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand, .question, .button, .mode, .panel-name, .panel-link { display: inline-flex; align-items: center; gap: 9px; }
  .brand { font-size: 13px; font-weight: 650; color: var(--text); }
  .brand-mark { width: 28px; height: 28px; padding: 5px; display: grid; background: var(--lime); color: var(--background); border-radius: 4px; }
  .icon { width: 17px; height: 17px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .brand-mark .icon { width: 100%; height: 100%; stroke-width: 1.9; }
  .question { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .question b { color: var(--text); font: 600 13px var(--mono); letter-spacing: .09em; }
  main.shell { padding: 32px 0 32px; }
  .intro { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 24px; }
  h1 { margin: 0; font-size: clamp(40px, 5vw, 65px); font-weight: 780; letter-spacing: -.075em; line-height: 1.1; }
  .intro p { color: var(--muted); margin: 10px 0 0; font-size: 14px; line-height: 1.65; }
  .button { justify-content: center; min-height: 42px; padding: 0 14px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 7px; white-space: nowrap; font-size: 13px; font-weight: 650; }
  .button:hover:not(:disabled), .panel-link:hover { background: #252e25; }
  .button.primary { border-color: var(--lime); background: var(--lime); color: #1b2516; }
  .button.primary:hover:not(:disabled) { background: #e7ffae; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
  .modes { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: #101410; }
  .mode { min-height: 34px; padding: 0 11px; border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; justify-content: center; }
  .mode:hover { color: var(--text); }
  .mode[aria-pressed="true"] { background: #283323; border-color: #3b5132; color: var(--lime); }
  .view-hint { color: var(--muted); font-size: 12px; margin: 0; }
  .boards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .boards[data-view]:not([data-view="split"]) { grid-template-columns: minmax(0, 550px); justify-content: center; }
  .panel { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0 11px 11px; --accent: var(--lime); }
  .panel.vertical, .projection.vertical { --accent: var(--mint); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 54px; padding: 0 3px; }
  .panel-name { color: var(--accent); gap: 11px; }
  .panel-name h2, .projection h1 { color: var(--text); margin: 0; font-size: 16px; letter-spacing: .025em; font-weight: 700; }
  .panel-link { min-height: 36px; padding: 0 8px; border-radius: 5px; color: var(--muted); font-size: 12px; }
  .panel-link .icon { width: 14px; height: 14px; }
  .map { overflow: hidden; border: 1px solid #2b362d; border-radius: 6px; background: var(--board); }
  .map svg { display: block; width: 100%; height: auto; }
  .wall { fill: none; stroke: #e1e7db; stroke-width: .125; stroke-linecap: round; }
  .maze-frame { fill: none; stroke: #ff625b; stroke-width: .19; }
  .glyph-fill { fill: #33472d; }
  .glyph-edge { fill: none; stroke: var(--lime); stroke-width: .165; stroke-linecap: round; }
  .answer-panel { margin-top: 14px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .answer-panel form { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
  .answer-label { flex: 1 1 160px; }
  .answer-label label { display: block; font-size: 15px; font-weight: 700; }
  .answer-label p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
  .guess { width: 128px; min-height: 42px; padding: 0 10px 0 16px; border: 1px solid #475345; border-radius: 6px; color: var(--text); background: #131814; text-align: center; font: 650 22px var(--mono); letter-spacing: .24em; }
  .guess::placeholder { color: #7b8a7a; font-size: 17px; }
  .guess[aria-invalid="true"] { border-color: var(--danger); }
  .answer-panel .quiet { color: var(--muted); }
  .feedback { margin: 10px 0 0; color: var(--lime); font-size: 13px; line-height: 1.5; }
  .feedback:empty { display: none; }
  .feedback[data-state="error"] { color: var(--danger); }
  .projection { --accent: var(--lime); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
  .projection-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 10px max(18px, 3vw); border-bottom: 1px solid var(--line); }
  .projection-head .question { margin-left: auto; }
  .projected { display: grid; align-content: center; justify-items: center; padding: 12px; }
  .projected .map { width: min(100%, calc((100dvh - 88px) * var(--map-ratio))); }
  .projected svg { max-height: calc(100dvh - 88px); }
  @media (max-width: 740px) {
    .shell { width: calc(100% - 32px); }
    main.shell { padding-top: 26px; }
    .intro { gap: 12px; margin-bottom: 18px; }
    .intro p { font-size: 13px; }
    .view-hint { display: none; }
    .panel-head { min-height: 48px; }
  }
  @media (max-width: 590px) {
    .boards { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .panel { padding: 0 8px 8px; }
    .modes { display: grid; width: 100%; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .mode { padding: 0 4px; gap: 5px; min-height: 38px; }
    .mode .icon { width: 13px; height: 13px; }
    .answer-label { flex: 1 0 100%; }
    .answer-panel form { gap: 8px; }
    .guess { width: 99px; letter-spacing: .15em; padding: 0 6px 0 9px; }
    .answer-panel .button { padding: 0 9px; }
    .projection .question span { display: none; }
    .projection-head { gap: 9px; }
  }
  @media (max-width: 360px) {
    .shell { width: calc(100% - 24px); }
    .intro .button, .projection .button { padding-inline: 8px; }
    .intro .button .icon, .projection .button .icon { display: none; }
    .mode .icon { display: none; }
  }
</style>
</head>

<div id="game" hidden>
  <header class="mast">
    <div class="shell">
      <span class="brand"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-maze"/></svg></span>迷宫密码挑战</span>
      <span class="question"><span>题号</span><b id="questionId"></b></span>
    </div>
  </header>
  <main class="shell">
    <div class="intro">
      <div>
        <h1>拆墙寻码</h1>
        <p>对照两面屏，把横墙和竖墙拼回一张迷宫，辨认墙里围出的 4 个数字。</p>
      </div>
      <button id="newPuzzle" class="button" type="button"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>换一题</button>
    </div>
    <div class="toolbar">
      <div class="modes" role="group" aria-label="迷宫视图">
        <button class="mode" type="button" data-mode="split" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#i-split"/></svg>双屏</button>
        <button class="mode" type="button" data-mode="h" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-horizontal"/></svg>横墙</button>
        <button class="mode" type="button" data-mode="v" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-vertical"/></svg>竖墙</button>

    <div id="boards" class="boards" data-view="split">
      <section id="horizontalPanel" class="panel horizontal">
        <header class="panel-head">
          <div class="panel-name"><svg class="icon" aria-hidden="true"><use href="#i-horizontal"/></svg><h2>横向墙壁</h2></div>
          <a id="horizontalLink" class="panel-link" target="_blank" rel="noopener" aria-label="在独立窗口打开横墙屏">独立窗口<svg class="icon" aria-hidden="true"><use href="#i-window"/></svg></a>
        </header>
        <div id="horizontalMap" class="map"></div>
      </section>
      <section id="verticalPanel" class="panel vertical">
        <header class="panel-head">
          <div class="panel-name"><svg class="icon" aria-hidden="true"><use href="#i-vertical"/></svg><h2>纵向墙壁</h2></div>
          <a id="verticalLink" class="panel-link" target="_blank" rel="noopener" aria-label="在独立窗口打开竖墙屏">独立窗口<svg class="icon" aria-hidden="true"><use href="#i-window"/></svg></a>
        </header>
        <div id="verticalMap" class="map"></div>
      </section>
      <section id="combinedPanel" class="panel" hidden>
        <header class="panel-head"><div class="panel-name"><svg class="icon" aria-hidden="true"><use href="#i-maze"/></svg><h2 id="combinedTitle">完整迷宫</h2></div></header>
        <div id="combinedMap" class="map"></div>
      </section>
    </div>
    <section class="answer-panel" aria-label="破解密码">
      <form id="answerForm" novalidate>
        <div class="answer-label">
          <label for="guess">四位密码</label>
          <p id="order">左上 → 右上 → 左下 → 右下</p>
        </div>
        <input id="guess" class="guess" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="····" aria-describedby="order">
        <button id="submitGuess" class="button primary" type="submit">验证密码</button>
        <button id="reveal" class="button quiet" type="button" aria-pressed="false">查看答案</button>
      </form>
      <p class="feedback" id="feedback" role="status"></p>
    </section>
  </main>
</div>
<div id="projection" class="projection" hidden>
  <header class="projection-head">
    <div class="panel-name"><svg class="icon" aria-hidden="true"><use id="projectionIcon" href="#i-horizontal"/></svg><h1 id="projectionTitle"></h1></div>
    <span class="question"><span>题号</span><b id="projectionId"></b></span>
    <button id="full" class="button" type="button"><svg class="icon" aria-hidden="true"><use href="#i-full"/></svg><span>全屏</span></button>
  </header>
  <main class="projected"><div id="projectionMap" class="map"></div></main>
</div>
<script id="maze-engine">
const Maze = (() => {
  const columns = 28;
  const rows = 24;
  const masks = [
    ['#######', '#.....#', '#.....#', '#.....#', '#.....#', '#.....#', '#.....#', '#.....#', '#######'],
    ['...#...', '..##...', '.###...', '...#...', '...#...', '...#...', '...#...', '...#...', '.#####.'],
    ['#######', '......#', '......#', '......#', '#######', '#......', '#......', '#......', '#######'],
    ['#######', '......#', '......#', '......#', '.######', '......#', '......#', '......#', '#######'],
    ['#...#..', '#...#..', '#...#..', '#...#..', '#######', '....#..', '....#..', '....#..', '....#..'],
    ['#######', '#......', '#......', '#......', '#######', '......#', '......#', '......#', '#######'],
    ['#######', '#......', '#......', '#......', '#######', '#.....#', '#.....#', '#.....#', '#######'],
    ['#######', '......#', '.....##', '.....#.', '....##.', '....#..', '...##..', '...#...', '...#...'],
    ['#######', '#.....#', '#.....#', '#.....#', '#######', '#.....#', '#.....#', '#.....#', '#######'],
    ['#######', '#.....#', '#.....#', '#.....#', '#######', '......#', '......#', '......#', '#######']
  ];
  const steps = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  const index = (x, y) => y * columns + x;

  function randomFor(seed) {
    let state = seed >>> 0;
    return () => {
      state = (state + 0x6D2B79F5) >>> 0;
      let mixed = Math.imul(state ^ state >>> 15, state | 1);
      mixed ^= mixed + Math.imul(mixed ^ mixed >>> 7, mixed | 61);
      return ((mixed ^ mixed >>> 14) >>> 0) / 4294967296;
    };
  }

  function generate(seed) {
    const random = randomFor(seed);
    const regions = new Uint8Array(columns * rows);
    const horizontal = Array.from({ length: rows + 1 }, () => new Uint8Array(columns).fill(1));
    const vertical = Array.from({ length: rows }, () => new Uint8Array(columns + 1).fill(1));
    const digits = [];

    for (let quadrant = 0; quadrant < 4; quadrant++) {
      const digit = Math.floor(random() * 10);
      const left = (quadrant % 2) * (columns / 2) + 2 + Math.floor(random() * 4);
      const top = Math.floor(quadrant / 2) * (rows / 2) + 1 + Math.floor(random() * 2);
      digits.push(digit);
      masks[digit].forEach((line, y) => {
        Array.from(line).forEach((cell, x) => {
          if (cell === '#') regions[index(left + x, top + y)] = quadrant + 1;
        });
      });
    }

    function carve(x, y, otherX, otherY) {
      if (x === otherX) horizontal[Math.max(y, otherY)][x] = 0;
      else vertical[y][Math.max(x, otherX)] = 0;
    }

    const visited = new Uint8Array(regions.length);
    function carvePassages(startX, startY) {
      const stack = [[startX, startY]];
      visited[index(startX, startY)] = 1;
      while (stack.length) {
        const [x, y] = stack[stack.length - 1];
        const neighbors = [];
        for (const [dx, dy] of steps) {
          const nx = x + dx;
          const ny = y + dy;
          if (nx < 0 || nx >= columns || ny < 0 || ny >= rows) continue;
          const neighbor = index(nx, ny);
          if (!regions[neighbor] && !visited[neighbor]) neighbors.push([nx, ny]);
        }
        if (!neighbors.length) {
          stack.pop();
          continue;
        }
        const [nx, ny] = neighbors[Math.floor(random() * neighbors.length)];
        carve(x, y, nx, ny);
        visited[index(nx, ny)] = 1;
        stack.push([nx, ny]);
      }
    }

    carvePassages(0, 0);

    // Clear the digit strokes and open a few extra passages in the outer maze.
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < columns; x++) {
        const cell = index(x, y);
        const region = regions[cell];
        if (!region && !visited[cell]) continue;
        if (x + 1 < columns && regions[index(x + 1, y)] === region && (region || random() < .08)) {
          carve(x, y, x + 1, y);
        }
        if (y + 1 < rows && regions[index(x, y + 1)] === region && (region || random() < .08)) {
          carve(x, y, x, y + 1);
        }
      }
    }

    // Carve a separate maze inside each enclosed digit loop.
    for (let cell = 0; cell < regions.length; cell++) {
      if (!regions[cell] && !visited[cell]) {
        carvePassages(cell % columns, Math.floor(cell / columns));
      }
    }

    return { horizontal, vertical, regions, code: digits.join('') };
  }

  function wallPaths({ horizontal, vertical, regions }) {
    const paths = { h: '', v: '', outline: '', fill: '' };
    horizontal.forEach((line, y) => line.forEach((wall, x) => {
      if (!wall) return;
      const segment = `M${x} ${y}h1`;
      paths.h += segment;
      const above = y > 0 && regions[index(x, y - 1)];
      const below = y < rows && regions[index(x, y)];
      if (above || below) paths.outline += segment;
    }));
    vertical.forEach((line, y) => line.forEach((wall, x) => {
      if (!wall) return;
      const segment = `M${x} ${y}v1`;
      paths.v += segment;
      const left = x > 0 && regions[index(x - 1, y)];
      const right = x < columns && regions[index(x, y)];
      if (left || right) paths.outline += segment;
    }));
    regions.forEach((region, position) => {
      if (region) paths.fill += `M${position % columns} ${Math.floor(position / columns)}h1v1h-1z`;
    });
    return paths;
  }

  return { columns, rows, generate, wallPaths };
})();
</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const url = new URL(location.href);
  const settings = new URLSearchParams(url.hash.slice(1));
  const screen = settings.get('screen');
  const standalone = ['h', 'v'].includes(screen) ? screen : null;
  const seedFrom = value => {
    if (!/^[0-9A-Z]{1,7}$/i.test(value ?? '')) return null;
    const number = parseInt(value, 36);
    return number <= 0xffffffff ? number : null;
  };
  const randomSeed = () => crypto.getRandomValues(new Uint32Array(1))[0];
  const formatSeed = value => value.toString(36).toUpperCase().padStart(7, '0');
  const formatRoom = () => randomSeed().toString(36) + randomSeed().toString(36);
  function roomForTab() {
    const newRoom = formatRoom();
    try {
      const key = 'split-maze-room/' + url.pathname;
      const saved = sessionStorage.getItem(key);
      if (saved) return saved;
      sessionStorage.setItem(key, newRoom);
    } catch {
      // Local browsing can restrict storage. Live updates work for this page load.
    }
    return newRoom;
  }
  const displayRoom = settings.get('room');
  const room = standalone
    ? (/^[a-z0-9]{2,14}$/.test(displayRoom ?? '') ? displayRoom : formatRoom())
    : roomForTab();
  const channel = 'BroadcastChannel' in window ? new BroadcastChannel('split-maze/' + room) : null;
  const titles = { h: '横向墙壁', v: '纵向墙壁', both: '完整迷宫' };
  const hints = {
    split: '两幅图点阵相同，可用它对齐墙壁',
    h: '只显示横向墙壁',
    v: '只显示纵向墙壁',
    both: '横墙与竖墙在同一坐标上叠合'
  };
  let seed = seedFrom(settings.get('seed')) ?? 7392;
  let puzzle;
  let paths;
  let mode = 'split';
  let revealed = false;
  let solved = false;
  let result = {};

  function updateAddress() {
    settings.set('seed', formatSeed(seed));
    // Display URLs retain the room so they can find the matching control tab.
    if (standalone) settings.set('room', room);
    else settings.delete('room');
    url.hash = settings.toString();
    if (url.href !== location.href) history.replaceState(null, '', url);
  }

  function projectionUrl(direction) {
    const link = new URL(url);
    const displaySettings = new URLSearchParams(settings);
    displaySettings.set('screen', direction);
    displaySettings.set('room', room);
    link.hash = displaySettings.toString();
    return link.href;
  }

  function drawMap(target, direction, answer = false) {
    const { columns, rows } = Maze;
    const width = columns + 1.1;
    const height = rows + 1.1;
    target.style.setProperty('--map-ratio', String(width / height));
    const horizontal = direction !== 'v' ? `<path class="wall" data-wall="h" d="${paths.h}"/>` : '';
    const vertical = direction !== 'h' ? `<path class="wall" data-wall="v" d="${paths.v}"/>` : '';
    target.innerHTML = `
      <svg viewBox="-0.55 -0.55 ${width} ${height}" role="img" aria-label="${answer ? '高亮四个数字区域的完整迷宫' : titles[direction]}">
        <defs>
          <pattern id="dots-${target.id}" width="1" height="1" patternUnits="userSpaceOnUse" x="-.5" y="-.5">
            <circle cx=".5" cy=".5" r=".046" fill="#627660" opacity=".55"/>
          </pattern>
        </defs>
        <rect x="-.1" y="-.1" width="${columns + .2}" height="${rows + .2}" fill="url(#dots-${target.id})"/>
        ${answer ? `<path class="glyph-fill" d="${paths.fill}"/>` : ''}
        ${horizontal}
        ${vertical}
        ${direction === 'both' ? '' : `<rect class="maze-frame" width="${columns}" height="${rows}"/>`}
        ${answer ? `<path class="glyph-edge" d="${paths.outline}"/>` : ''}
      </svg>`;
  }

  function feedback(message, state = '') {
    $('feedback').textContent = message;
    $('feedback').dataset.state = state;
  }

  function showMode() {
    const view = revealed ? 'both' : mode;
    $('boards').dataset.view = view;
    $('horizontalPanel').hidden = view !== 'split' && view !== 'h';
    $('verticalPanel').hidden = view !== 'split' && view !== 'v';
    $('combinedPanel').hidden = view !== 'both';
    $('combinedTitle').textContent = revealed ? '数字区域' : titles.both;
    $('viewHint').textContent = revealed ? '亮色边界围出的区域就是数字' : hints[view];
    document.querySelectorAll('.mode').forEach(button => {
      button.setAttribute('aria-pressed', String(button.dataset.mode === view));
    });
    if (view === 'both') drawMap($('combinedMap'), 'both', revealed);
    else $('combinedMap').replaceChildren();
    $('reveal').textContent = revealed ? '收起答案' : '查看答案';
    $('reveal').setAttribute('aria-pressed', String(revealed));
    $('guess').disabled = revealed || solved;
    $('submitGuess').disabled = revealed || solved;
    feedback(revealed ? '本题密码  ' + puzzle.code : result.message ?? '', revealed ? '' : result.state ?? '');
  }

  function loadPuzzle() {
    puzzle = Maze.generate(seed);
    paths = Maze.wallPaths(puzzle);
    updateAddress();
    if (standalone) {
      $('projectionId').textContent = formatSeed(seed);
      drawMap($('projectionMap'), standalone);
      return;
    }
    $('questionId').textContent = formatSeed(seed);
    $('horizontalLink').href = projectionUrl('h');
    $('verticalLink').href = projectionUrl('v');
    drawMap($('horizontalMap'), 'h');
    drawMap($('verticalMap'), 'v');
    $('guess').value = '';
    $('guess').removeAttribute('aria-invalid');
    revealed = false;
    solved = false;
    result = {};
    showMode();
  }

  function publishPuzzle() {
    channel?.postMessage({ type: 'puzzle', seed: formatSeed(seed) });
  }

  if (standalone) {
    $('projection').hidden = false;
    $('projectionTitle').textContent = titles[standalone];
    $('projectionIcon').setAttribute('href', standalone === 'h' ? '#i-horizontal' : '#i-vertical');
    $('projection').classList.toggle('vertical', standalone === 'v');
    document.title = titles[standalone] + ' · 拆墙寻码';
    $('full').hidden = !document.fullscreenEnabled;
    $('full').addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch {
        // The browser may reject fullscreen while the window is inactive.
      }
    });
    document.addEventListener('fullscreenchange', () => {
      $('full').querySelector('span').textContent = document.fullscreenElement ? '退出全屏' : '全屏';
    });
    channel?.addEventListener('message', ({ data }) => {
      if (data?.type !== 'puzzle') return;
      const nextSeed = seedFrom(data.seed);
      if (nextSeed === null || nextSeed === seed) return;
      seed = nextSeed;
      loadPuzzle();
    });
    channel?.postMessage({ type: 'request-puzzle' });
  } else {
    $('game').hidden = false;
    channel?.addEventListener('message', ({ data }) => {
      if (data?.type === 'request-puzzle') publishPuzzle();
    });
    document.querySelector('.modes').addEventListener('click', event => {
      const button = event.target.closest('[data-mode]');
      if (!button) return;
      mode = button.dataset.mode;
      revealed = false;
      showMode();
    });
    $('newPuzzle').addEventListener('click', () => {
      let nextSeed;
      do { nextSeed = randomSeed(); }
      while (nextSeed === seed || Maze.generate(nextSeed).code === puzzle.code);
      seed = nextSeed;
      loadPuzzle();
      publishPuzzle();
    });
    $('reveal').addEventListener('click', () => {
      revealed = !revealed;
      showMode();
    });
    $('guess').addEventListener('input', ({ target }) => {
      if (target.value) target.value = target.value.normalize('NFKC').replace(/[^0-9]/g, '').slice(0, 4);
      target.removeAttribute('aria-invalid');
      if (result.state === 'error') {
        result = {};
        feedback('');
      }
    });
    $('answerForm').addEventListener('submit', event => {
      event.preventDefault();
      if (revealed || solved) return;
      const guess = $('guess').value;
      if (guess.length === 4 && guess === puzzle.code) {
        solved = true;
        result = { message: '密码正确，解锁成功！' };
        showMode();
        return;
      }
      result = { state: 'error', message: guess.length !== 4 ? '请输入 4 位数字。' : '密码有误，再看看四个数字及其顺序。' };
      $('guess').setAttribute('aria-invalid', 'true');
      $('guess').focus();
      feedback(result.message, result.state);
    });
  }

  loadPuzzle();
  window.addEventListener('hashchange', () => {
    if (location.href !== url.href) location.reload();
  });
})();
</script>
</body>
</html>
